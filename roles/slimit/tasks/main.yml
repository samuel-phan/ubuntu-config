# Installation

# noqa: yaml[line-length]
- name: Add ssprea nvidia control APT repo
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    curl -s --compressed "https://ssprea.github.io/snvctl-apt-repo/ubuntu/KEY.gpg" | gpg --dearmor | tee /etc/apt/trusted.gpg.d/snvctl-apt-repo.gpg > /dev/null
    curl -s --compressed -o /etc/apt/sources.list.d/snvctl.list "https://ssprea.github.io/snvctl-apt-repo/ubuntu/snvctl.list"
  args:
    creates: /etc/apt/sources.list.d/snvctl.list

# noqa: package-latest
- name: Install slimit packages
  become: true
  ansible.builtin.apt:
    name:
      - slimit-gui
      - slimit-cli
      - slimit-daemon
    state: latest
    update_cache: true

# System configuration

- name: "Create the config dir {{ slimit_config_dir }}"
  become: true
  ansible.builtin.file:
    path: "{{ slimit_config_dir }}"
    state: directory
    mode: '755'

- name: Copy the profile & curve JSON files
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ slimit_config_dir }}/{{ item | basename }}"
    mode: '644'
  loop: "{{ lookup('fileglob', 'etc/*', wantlist=True) }}"
  notify: Restart slimitd service

- name: Start & enable the systemd slimitd.service
  become: true
  ansible.builtin.systemd_service:
    name: slimitd.service
    state: started
    enabled: true
    daemon_reload: true

# User configuration

- name: "Create the user config dir {{ slimit_user_config_dir }}"
  ansible.builtin.file:
    path: "{{ slimit_user_config_dir }}"
    state: directory
    mode: '755'

- name: "Symlink user config files in {{ slimit_user_config_dir }}"
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ slimit_user_config_dir }}/{{ item | basename }}"
    state: link
  loop: "{{ lookup('fileglob', '{{ role_path }}/files/user/*', wantlist=True) }}"
